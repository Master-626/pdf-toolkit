[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-toolkit"
version = "0.1.0"
description = "一个全能的PDF处理工具包，支持合并、拆分、压缩、加水印、提取文本等常用PDF操作"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["pdf", "toolkit", "cli", "merge", "split", "extract-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
    "PyPDF2>=3.0.0",
]

[project.scripts]
pdf-toolkit = "pdf_toolkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/pdf-toolkit"
Repository = "https://github.com/Master-626/pdf-toolkit"
Issue-Tracker = "https://github.com/Master-626/pdf-toolkit/issues"
